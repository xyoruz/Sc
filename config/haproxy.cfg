global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    tune.bufsize 32768
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# ==================== FRONTEND ====================

frontend ssh-ssl
    bind *:8443
    mode tcp
    option tcplog
    default_backend ssh-22

frontend xray-tls
    bind *:2053
    mode tcp
    default_backend xray-443

frontend xray-ntls
    bind *:2082
    mode tcp
    default_backend nginx-80

frontend xray-ntls2
    bind *:8080
    mode tcp
    default_backend nginx-80

# ==================== BACKEND ====================

backend ssh-22
    mode tcp
    server ssh 127.0.0.1:22

backend xray-443
    mode tcp
    server xray 127.0.0.1:443

backend nginx-80
    mode tcp
    server nginx 127.0.0.1:80